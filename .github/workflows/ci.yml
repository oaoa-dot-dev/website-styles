name: Build & Validate Assets

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install libbrotli
      run: sudo apt-get update && sudo apt-get install -y libbrotli1

    - name: Build and Compress Assets
      run: python3 scripts/build.py

    - name: Verify dist files
      run: |
        test -f dist/framework.min.css
        test -f dist/framework.min.js
        test -f dist/index.html
        test -f dist/_headers
        echo "All assets verified successfully!"
